<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="لعبة معلومات إسلامية ثلاثية الأبعاد في حارات دمشق القديمة وقلعتها">
<meta name="theme-color" content="#1c1426">
<style>/* Layout: full-screen 3D game */html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style>
<title>درب المعلومات الإسلامية</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
/* Layout: full-screen 3D canvas; thin HUD on top, joystick + jump at bottom, riddle sheet slides up from bottom */
:root{
  --night:#1c1426; --panel:rgba(28,20,30,.94); --line:#5a4636; --lamp:#f0b44c; --ink:#f7f0e4; --muted:#c8b8a2;
  --ok:#3fbf86; --bad:#e8604d; --basalt:#2b2b30;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-ui:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.hud{position:fixed;top:0;left:0;right:0;z-index:5;direction:rtl;display:flex;align-items:center;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(10,6,12,.75),transparent);pointer-events:none}
.lvl{flex:1;min-width:0;line-height:1.25}
.lvl small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl b{font-family:var(--f-display);font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:4px;margin-top:4px}
.pips i{width:16px;height:5px;border-radius:2px;background:rgba(255,255,255,.18)}
.pips i.on{background:var(--lamp)}
.pips i.wall{width:22px;background:rgba(200,190,170,.3)}
.pips i.wall.on{background:var(--ok)}
.hearts{font-size:21px;color:var(--bad);letter-spacing:1px;text-shadow:0 1px 4px #000}
.hearts .off{color:rgba(255,255,255,.18)}
.pts{background:rgba(0,0,0,.4);border:1px solid rgba(240,180,76,.55);color:var(--lamp);border-radius:999px;padding:3px 11px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mute{pointer-events:auto;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--muted);width:36px;height:36px;border-radius:10px;font-size:16px}

.banner{position:fixed;top:24%;left:0;right:0;z-index:4;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s,transform .5s;transform:translateY(-10px);direction:rtl;padding-inline:16px}
.banner.show{opacity:1;transform:none}
.banner>*{background:rgba(20,12,16,.45);border-radius:14px;padding-inline:14px;display:inline-block}
.banner small{margin-bottom:6px}
.banner small{display:table;margin-inline:auto;color:var(--lamp);font-size:15px;text-shadow:0 2px 8px #000}
.banner b{font-family:var(--f-display);font-size:38px;font-weight:700;text-shadow:0 3px 16px #000;text-wrap:balance}
.say{position:fixed;left:0;top:0;z-index:5;pointer-events:none;direction:rtl;white-space:nowrap;font-family:var(--f-ui);font-weight:700;font-size:16px;
  background:#fffaf0;color:#2a1a10;border:2px solid #d9a441;border-radius:16px;padding:6px 14px;box-shadow:0 4px 14px rgba(0,0,0,.35);
  transform:translate(-50%,-100%);animation:sayIn .25s ease-out}
.say::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:8px solid transparent;border-top-color:#d9a441;border-bottom:0}
.say.npc{background:#eef7ee;border-color:#2f7a3e}.say.npc::after{border-top-color:#2f7a3e}
.say.out{opacity:0;transition:opacity .4s}
@keyframes sayIn{from{opacity:0;margin-top:10px}}
.toast{position:fixed;left:50%;top:40%;z-index:6;transform:translate(-50%,0);font-family:var(--f-display);font-size:32px;color:var(--lamp);text-shadow:0 2px 10px #000;pointer-events:none;animation:up 1.1s forwards;white-space:nowrap}
.toast.bad{color:var(--bad)}
.great{position:fixed;left:50%;top:30%;z-index:7;transform:translate(-50%,0);text-align:center;font-family:var(--f-display);font-size:56px;font-weight:700;color:#ffd060;
  text-shadow:0 0 24px rgba(255,200,80,.8),0 4px 14px #000;pointer-events:none;animation:great 2.2s forwards;white-space:nowrap;direction:rtl}
.great small{display:block;font-family:var(--f-ui);font-size:16px;color:var(--ink);text-shadow:0 2px 8px #000}
@keyframes great{0%{transform:translate(-50%,0) scale(.3);opacity:0}15%{transform:translate(-50%,0) scale(1.15);opacity:1}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-30px) scale(1);opacity:0}}
@keyframes up{to{transform:translate(-50%,-60px);opacity:0}}
.flash{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(transparent 40%,rgba(232,96,77,.55));opacity:0;transition:opacity .35s}
.flash.on{opacity:1;transition:none}
.fade{position:fixed;inset:0;z-index:9;background:#0c0810;opacity:0;pointer-events:none;transition:opacity .4s}
.fade.on{opacity:1}

.joy{position:fixed;z-index:4;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);pointer-events:none;display:none}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(240,180,76,.85);box-shadow:0 0 18px rgba(240,180,76,.6)}
.hint-joy{position:fixed;z-index:4;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);left:max(26px,env(safe-area-inset-left,0px));width:96px;height:96px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);display:grid;place-items:center;color:rgba(255,255,255,.55);font-size:12px;pointer-events:none;text-align:center;line-height:1.4}
.jump{position:fixed;z-index:5;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);right:max(24px,env(safe-area-inset-right,0px));width:84px;height:84px;border-radius:50%;
  background:rgba(240,180,76,.22);border:2px solid var(--lamp);color:var(--lamp);font-size:30px;font-weight:700}
.jump:active{background:rgba(240,180,76,.5)}

.sheet{position:fixed;left:50%;top:50%;z-index:8;direction:rtl;width:min(560px,calc(100% - 32px));max-height:calc(100% - 140px);overflow:auto;box-sizing:border-box;
  background:var(--panel);border:2px solid var(--lamp);border-radius:22px;padding:16px;box-shadow:0 18px 60px rgba(0,0,0,.55);
  transform:translate(-50%,-46%) scale(.92);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.3,1.3,.5,1),opacity .2s}
.sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet .tag{align-self:center;font-size:12px;color:var(--lamp);border:1px solid rgba(240,180,76,.4);border-radius:999px;padding:2px 12px}
.q{font-family:var(--f-ui);font-size:24px;font-weight:700;line-height:1.6;letter-spacing:0;text-align:center;text-wrap:balance;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:rgba(255,255,255,.06);border:1.5px solid var(--line);color:var(--ink);border-radius:14px;min-height:60px;padding:8px;font-size:19px;font-weight:700;font-family:var(--f-ui);line-height:1.4;transition:transform .1s,background .2s}
.opt:active{transform:scale(.96)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#04140c}
.opt.bad{border-color:var(--bad);color:var(--bad);opacity:.5}
.opt.gone{opacity:.12}
.opt.wait{opacity:.6}
.help{align-self:center;background:none;border:1.5px dashed var(--lamp);color:var(--lamp);border-radius:999px;padding:6px 16px;font-size:14px}
.help:disabled{opacity:.3}
.learn{border:1.5px solid rgba(240,180,76,.5);background:rgba(240,180,76,.08);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:center;animation:pop .3s}
.learn b{color:var(--lamp);font-size:16px}
.learn .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.learn .chips span{background:rgba(255,255,255,.1);border-radius:999px;padding:4px 11px;font-size:15px;font-weight:600}
.learn .ask{font-size:20px;font-weight:700;color:var(--ink)}
@keyframes pop{from{transform:scale(.95);opacity:0}}

.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;direction:rtl;text-align:center;
  background:radial-gradient(circle at 50% 30%,rgba(120,60,50,.5),rgba(12,8,16,.93));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen .box{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:380px;width:100%}
.screen h1{font-family:var(--f-display);font-size:clamp(36px,11vw,50px);text-wrap:balance;margin:0;color:var(--lamp);text-shadow:0 4px 30px rgba(240,180,76,.4);line-height:1.2}
.screen .sub{font-family:var(--f-display);color:var(--ink);font-size:20px;margin-top:-8px}
.screen p{margin:0;color:var(--muted);font-size:15px;line-height:1.8}
.ablaq{width:180px;height:10px;background:repeating-linear-gradient(90deg,#e6d8bc 0 18px,#2b2b30 18px 36px);border-radius:2px}
.keys{display:flex;gap:18px;color:var(--ink);font-size:14px;justify-content:center;flex-wrap:wrap}
.keys span{display:flex;flex-direction:column;align-items:center;gap:4px}
.keys b{font-size:24px}
.big{background:var(--lamp);color:#2a1a04;border:0;border-radius:16px;padding:16px;width:100%;font-size:20px;font-weight:700;box-shadow:0 6px 30px rgba(240,180,76,.35)}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:12px;width:100%;font-size:15px}
.err{color:var(--bad)}
.acct{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.acct b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--lamp);font-size:14px;text-decoration:underline;padding:4px}
.form{display:flex;flex-direction:column;gap:10px;width:100%;text-align:right}
.form label{font-size:13px;color:var(--muted)}
.form input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.08);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);font:600 16px var(--f-ui);padding:12px;direction:ltr;text-align:left}
.form input.ar{direction:rtl;text-align:right}
.form input:focus{outline:none;border-color:var(--lamp)}
.msg{font-size:14px;line-height:1.7;min-height:1em}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.board{width:100%;display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.board div{display:flex;justify-content:space-between;gap:10px;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums}
.board div.me{outline:1.5px solid var(--lamp)}
.board span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loading{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);transform:translateX(-50%);z-index:9;background:rgba(0,0,0,.6);color:var(--ink);padding:8px 16px;border-radius:999px;font-size:14px;direction:rtl}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>

<div id="stage"></div>
<div class="flash" id="flash"></div>
<div class="hud" id="hud" hidden>
  <div class="lvl"><small id="lvlNum"></small><b id="lvlName"></b><div class="pips" id="pips"></div></div>
  <div class="hearts" id="hearts"></div>
  <div class="pts" id="pts">★ ٠</div>
  <button class="mute" id="mute" aria-label="الصوت">♪</button>
</div>
<div class="banner" id="banner"><small id="bnSmall"></small><b id="bnBig"></b></div>
<div class="joy" id="joy"><i id="knob"></i></div>
<div class="hint-joy" id="hintJoy" hidden>اسحب في أي<br>مكان للمشي</div>
<button class="jump" id="jumpBtn" hidden aria-label="قفز">⤒</button>
<div class="sheet" id="sheet"><div class="sheet-in">
  <span class="tag" id="qTag"></span>
  <p class="q" id="q"></p>
  <div class="opts" id="opts"></div>
  <div class="learn" id="learn" hidden></div>
  <button class="help" id="help">✦ احذف إجابتين</button>
</div></div>
<div class="fade" id="fade"></div>
<div class="screen" id="screen"></div>
